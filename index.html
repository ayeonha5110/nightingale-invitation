<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제9회 나이팅게일 선서식</title>
<meta name="description" content="제9회 나이팅게일 선서식 초대장">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f3f1ef}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center}.invitation{width:100%;max-width:900px}.page{display:block;width:100%;height:auto;vertical-align:top} .hint{position:fixed;right:14px;bottom:14px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.show{opacity:1}@media(min-width:901px){.invitation{box-shadow:0 0 30px rgba(0,0,0,.08)}}
</style>
</head>
<body>
<main class="invitation" aria-label="제9회 나이팅게일 선서식 초대장">
  <img class="page" src="page-1.png" alt="제9회 나이팅게일 선서식 초대장 1페이지">
  <img class="page" src="page-2.png" alt="모시는 글 2페이지">
  <img class="page" src="page-3.png" alt="식순 3페이지">
  <img class="page" src="page-4.png" alt="오시는 길 4페이지">
  <img class="page" src="page-5.png" alt="선서생 명단 5페이지">
</main>
<div id="hint" class="hint">스크롤하여 초대장을 확인하세요</div>
<script>
const h=document.getElementById('hint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),2200);
</script>
</body>
</html>
